name: Check
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify library, runtime, protocols, and packaging
        run: python scripts/check_tests.py --minimum 70
        env:
          PYTHONPATH: src
      - name: Compile runtime
        run: python -m compileall -q src scripts
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare verified build compiler
        shell: pwsh
        run: |
          $taskInnoInstaller = Join-Path $env:RUNNER_TEMP 'inno-setup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $taskInnoInstaller
          if ((Get-FileHash $taskInnoInstaller -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw 'Compiler SHA256 mismatch' }
          if ((Get-AuthenticodeSignature $taskInnoInstaller).Status -ne 'Valid') { throw 'Compiler signature invalid' }
          $taskInnoDir = Join-Path $env:RUNNER_TEMP 'inno'
          $taskInnoProcess = Start-Process $taskInnoInstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/PORTABLE=1',('/DIR="'+$taskInnoDir+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($taskInnoProcess.ExitCode -ne 0) { throw 'Compiler setup failed' }
      - name: Build embedded runtime and native installer
        shell: pwsh
        run: python scripts/build_windows.py --work-dir build/windows --output-dir dist/windows --compiler "$env:RUNNER_TEMP/inno/ISCC.exe"
      - name: Verify without system Python on PATH
        run: python scripts/smoke_windows.py --root build/windows/payload
      - uses: actions/upload-artifact@v4
        with:
          name: autoharness-windows-x64
          path: dist/windows/*
  macos-package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test on native macOS
        run: python scripts/check_tests.py --minimum 70
        env:
          PYTHONPATH: src
      - name: Build bundled runtime, native apps and DMG
        run: python scripts/build_macos.py --work-dir build/macos --output-dir dist/macos
      - name: Verify bundled runtime and actual Codex registration without system Python
        run: python scripts/smoke_macos.py --payload 'build/macos/distribution/Install AutoHarness.app/Contents/Resources/payload'
      - uses: actions/upload-artifact@v4
        with:
          name: autoharness-${{ matrix.os }}
          path: dist/macos/*
